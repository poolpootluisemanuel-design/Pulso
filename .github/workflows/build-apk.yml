# PULSO — APK debug automático (sin computadora)
name: Build APK debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (dist)
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Restaurar splash.png (no está en el repo)
        run: |
          for d in android/app/src/main/res/drawable android/app/src/main/res/drawable-land-hdpi android/app/src/main/res/drawable-land-mdpi android/app/src/main/res/drawable-land-xhdpi android/app/src/main/res/drawable-land-xxhdpi android/app/src/main/res/drawable-land-xxxhdpi android/app/src/main/res/drawable-port-hdpi android/app/src/main/res/drawable-port-mdpi android/app/src/main/res/drawable-port-xhdpi android/app/src/main/res/drawable-port-xxhdpi android/app/src/main/res/drawable-port-xxxhdpi; do cp public/icons/icon-512.png "$d/splash.png"; done
          ls android/app/src/main/res/drawable/splash.png

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Instalar plataforma y build-tools 36
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK debug
        working-directory: android
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
